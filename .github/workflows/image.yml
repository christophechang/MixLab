# Builds the engine image (Dockerfile). Push and pull request: build, run the default
# command, check the probe line. Release published: push to GHCR and record the digest
# in the release notes.
name: image

on:
  push:
    branches: ['**']   # branches only, so a tag push does not also build
  pull_request:
  release:
    types: [published]

jobs:
  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: mixlab:probe
          build-args: |
            MIXLAB_IMAGE_VERSION=${{ steps.sha.outputs.short }}
            MIXLAB_IMAGE_REVISION=${{ github.sha }}

      - name: Run the default command and check the probe line
        run: |
          set -euo pipefail
          out="$(docker run --rm --platform linux/amd64 mixlab:probe)"
          echo "$out"
          echo "$out" | grep -E '^mixlab-image [^ ]+ [0-9a-f]{7,40} started [0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?Z$'

  publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # provenance and sbom off: the pushed digest is then the single linux/amd64
      # manifest, not an index with an attestation entry.
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: ghcr.io/christophechang/mixlab:${{ github.event.release.tag_name }}
          build-args: |
            MIXLAB_IMAGE_VERSION=${{ github.event.release.tag_name }}
            MIXLAB_IMAGE_REVISION=${{ github.sha }}

      # Append to the release notes, never replace them.
      - name: Record the digest in the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json body -q .body > notes.md
          printf '\nImage: ghcr.io/christophechang/mixlab@%s\n' "$DIGEST" >> notes.md
          gh release edit "$TAG" --notes-file notes.md
